spring:
  application:
    name: xian-coffee-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xian_coffee?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 2544

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.Coffee.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

xian-coffee:
  upload:
    image-path: D:/XianCoffee/uploads/images
    image-url-prefix: /images/
